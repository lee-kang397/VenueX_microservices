server:
  port: 8081

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  application:
    name: venue-service   

  datasource:
    url: jdbc:postgresql://venue-db:5432/venue_db
    username: venue_user
    password: venue_pass

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ERROR
    org.springframework: ERROR
    org.hibernate: ERROR
