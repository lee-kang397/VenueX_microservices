server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/hostdb
    username: hostuser
    password: hostpass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
  enabled: true
  baseline-on-migrate: true
  locations: classpath:db/migration

  eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # server might not exist yet
    register-with-eureka: true
    fetch-registry: true
  instance:
  prefer-ip-address: true
