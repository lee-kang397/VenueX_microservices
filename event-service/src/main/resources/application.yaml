server:
  port: 8082  

spring:
  application:
    name: event-service   

  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ERROR
    org.springframework: ERROR
    org.hibernate: ERROR