server:
  port: 8082  

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  application:
    name: event-service   

  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ERROR
    org.springframework: ERROR
    org.hibernate: ERROR