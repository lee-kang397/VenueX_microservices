server:
  port: 8084

spring:
  application:
    name: auth-service 
    
  datasource:
    url: jdbc:postgresql://authdb:5432/authdb
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "our-very-secure-and-very-long-secret-key-at-least-32-chars-long"
    expiration-ms: 86400000 # 24 hours

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true